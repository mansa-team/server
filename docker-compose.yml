services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mansa_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
      - "${STOCKSAPI_PORT:-3200}:${STOCKSAPI_PORT:-3200}"
      - "${PROMETHEUS_PORT:-3200}:${PROMETHEUS_PORT:-3200}"
      - "${USER_PORT:-3200}:${USER_PORT:-3200}"
    environment:
      - DEBUG_MODE=TRUE
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  db_data: