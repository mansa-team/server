services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mansa_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  searxng:
    image: dandehoon/searxng-mcp:latest
    restart: always
    ports:
      - "8888:8888"
    environment:
      - SEARXNG_MCP_TRANSPORT=http
      - SEARXNG_PORT=8888
      
  api:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - server-api:latest
    restart: always
    ports:
      - "8000:8000"
      - "${STOCKSAPI_PORT:-3200}:${STOCKSAPI_PORT:-3200}"
      - "${PROMETHEUS_PORT:-3200}:${PROMETHEUS_PORT:-3200}"
      - "${USER_PORT:-3200}:${USER_PORT:-3200}"
    environment:
      - DEBUG_MODE=TRUE
      - TZ=America/Sao_Paulo

    volumes:
      - .:/app

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    restart: always
    ports:
      - "${SANDBOX_PORT:-8080}:8080"
    volumes:
      - workspace_data:/workspace


volumes:
  db_data:
  workspace_data: