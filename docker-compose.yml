services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mansa_db}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  searxng:
    image: dandehoon/searxng-mcp:latest
    restart: always
    ports:
      - "8888:8888"
    environment:
      - SEARXNG_MCP_TRANSPORT=http
      - SEARXNG_PORT=8888

  forgevm:
    build:
      context: .
      dockerfile: Dockerfile.forgevm
    restart: always
    ports:
      - "7423:7423"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - forgevm-data:/data
      - workspaces:/data/workspaces
      - ./forgevm.yaml:/forgevm.yaml
    environment:
      - FORGEVM_DATABASE_PATH=/data/forgevm.db
      - FORGEVM_LOGGING_LEVEL=info
      - FORGEVM_API_TOKEN=${FORGEVM_API_TOKEN:-}
            
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
      - "${STOCKSAPI_PORT:-3200}:${STOCKSAPI_PORT:-3200}"
      - "${ORUNMILA_PORT:-3200}:${ORUNMILA_PORT:-3200}"
      - "${USER_PORT:-3200}:${USER_PORT:-3200}"
    environment:
      - DEBUG_MODE=TRUE
      - TZ=America/Sao_Paulo
      - FORGEVM_API_TOKEN=${FORGEVM_API_TOKEN:-}
      - USER_MYSQL_HOST
      - USER_MYSQL_USER
      - USER_MYSQL_PASSWORD
      - USER_MYSQL_DATABASE
      - STOCKS_MYSQL_HOST
      - STOCKS_MYSQL_USER
      - STOCKS_MYSQL_PASSWORD
      - STOCKS_MYSQL_DATABASE

    volumes:
      - .:/app
      - workspaces:/data/workspaces
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  nginx:
    image: nginx:1.27.4-alpine
    restart: always
    ports:
      - "${NGINX_PORT:-8080}:${NGINX_PORT:-8080}"
    environment:
      - NGINX_PORT=${NGINX_PORT:-8080}
      - STOCKSAPI_PORT=${STOCKSAPI_PORT:-3200}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  forgevm-data:
  workspaces:
  nginx_cache: