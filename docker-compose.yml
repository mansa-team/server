services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mansa_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  searxng:
    image: dandehoon/searxng-mcp:latest
    restart: always
    ports:
      - "8888:8888"
    environment:
      - SEARXNG_MCP_TRANSPORT=http
      - SEARXNG_PORT=8888

  forgevm:
    build:
      context: .
      dockerfile: Dockerfile.forgevm
    restart: always
    ports:
      - "7423:7423"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - forgevm-data:/data
      - workspaces:/data/workspaces
      - ./forgevm.yaml:/forgevm.yaml
    environment:
      - FORGEVM_DATABASE_PATH=/data/forgevm.db
      - FORGEVM_LOGGING_LEVEL=info
      - FORGEVM_API_TOKEN=${FORGEVM_API_TOKEN:-}
            
  api:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - server-api:latest
    restart: always
    ports:
      - "8000:8000"
      - "${STOCKSAPI_PORT:-3200}:${STOCKSAPI_PORT:-3200}"
      - "${PROMETHEUS_PORT:-3200}:${PROMETHEUS_PORT:-3200}"
      - "${USER_PORT:-3200}:${USER_PORT:-3200}"
    environment:
      - DEBUG_MODE=TRUE
      - TZ=America/Sao_Paulo
      - FORGEVM_API_TOKEN=${FORGEVM_API_TOKEN:-}

    volumes:
      - .:/app
      - workspaces:/data/workspaces
      - stocks-cache:/app/cache

volumes:
  db_data:
  forgevm-data:
  workspaces:
  stocks-cache: