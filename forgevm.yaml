server:
  host: "0.0.0.0"
  port: 7423

providers:
  default: "docker"
  docker:
    enabled: true
    runtime: "runc"
    network_mode: "none"
    read_only_rootfs: false

defaults:
  ttl: "15m"
  image: "sandbox-python:latest"
  memory_mb: 512
  vcpus: 1

auth:
  enabled: true
  # Token is injected from the FORGEVM_API_TOKEN environment variable.
  # Set a long random value (e.g. `openssl rand -hex 32`) — never commit it.
  token: "${FORGEVM_API_TOKEN}"

logging:
  level: "info"
  format: "json"