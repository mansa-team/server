name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install Ruff
        run: pip install ruff
        
      - name: Run Ruff
        run: ruff check main/ tests/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: bandit -r main/
        continue-on-error: true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install mypy and dependencies
        run: |
          pip install mypy types-requests types-pytz
          pip install -r requirements.txt
        
      - name: Run mypy
        run: mypy main/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          
      - name: Run Tests with Coverage
        run: pytest --cov=main --cov-report=xml --cov-report=term-missing
        env:
          PYTHONPATH: .
          
      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          
      - name: Check Coverage Threshold
        run: |
          pip install coverage
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(int(float(root.get('line-rate', 0)) * 100))")
          echo "Coverage: $COVERAGE%"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "Coverage check passed!"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t mansa-server:test .

      - name: Export CI database credentials
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.USER_MYSQL_PASSWORD }}" >> $GITHUB_ENV
          echo "MYSQL_DATABASE=${{ secrets.USER_MYSQL_DATABASE }}" >> $GITHUB_ENV
          echo "MYSQL_USER=${{ secrets.USER_MYSQL_USER }}" >> $GITHUB_ENV
          echo "MYSQL_PASSWORD=${{ secrets.USER_MYSQL_PASSWORD }}" >> $GITHUB_ENV
          echo "USER_MYSQL_HOST=db" >> $GITHUB_ENV
          echo "USER_MYSQL_USER=${{ secrets.USER_MYSQL_USER }}" >> $GITHUB_ENV
          echo "USER_MYSQL_PASSWORD=${{ secrets.USER_MYSQL_PASSWORD }}" >> $GITHUB_ENV
          echo "USER_MYSQL_DATABASE=${{ secrets.USER_MYSQL_DATABASE }}" >> $GITHUB_ENV
          echo "STOCKS_MYSQL_HOST=db" >> $GITHUB_ENV
          echo "STOCKS_MYSQL_USER=${{ secrets.STOCKS_MYSQL_USER }}" >> $GITHUB_ENV
          echo "STOCKS_MYSQL_PASSWORD=${{ secrets.STOCKS_MYSQL_PASSWORD }}" >> $GITHUB_ENV
          echo "STOCKS_MYSQL_DATABASE=${{ secrets.STOCKS_MYSQL_DATABASE }}" >> $GITHUB_ENV
          echo "USER_PORT=3200" >> $GITHUB_ENV
          echo "STOCKSAPI_PORT=3201" >> $GITHUB_ENV
          echo "PROMETHEUS_PORT=3202" >> $GITHUB_ENV

      - name: Install Docker Compose
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose

      - name: Start services
        run: docker compose up -d db api

      - name: Wait for MySQL to be ready
        run: sleep 15

      - name: Show container logs
        run: docker compose logs

      - name: Check health endpoints
        run: |
          curl -f http://localhost:8000/health || echo "Main health not available"
          echo ""
          curl -f http://localhost:3200/user/health || echo "User health not available"

      - name: Show API logs (verify migrations ran)
        run: docker compose logs api

      - name: Show final container status
        if: always()
        run: docker compose ps

      - name: Stop and remove containers
        if: always()
        run: docker compose down -v